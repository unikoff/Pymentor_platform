<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Path parameter lookup flow</title>
  <desc id="description">A request with a numeric task id is converted by FastAPI and passed to Python lookup. A match returns a copy and an HTTP 200 response. No match returns None and an HTTP 404 response. A non-numeric path value is rejected with 422 before Python lookup.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="28" markerHeight="28" viewBox="0 0 12 12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L10 6L1 11" stroke="#82E0AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="28" markerHeight="28" viewBox="0 0 12 12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L10 6L1 11" stroke="#55C7E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" markerWidth="28" markerHeight="28" viewBox="0 0 12 12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L10 6L1 11" stroke="#F07878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .group-title { font: 650 27px Inter, Segoe UI, sans-serif; fill: #F1F5F2; }
      .route { font: 500 21px Consolas, SFMono-Regular, monospace; fill: #E2ECE5; }
      .code { font: 500 23px Consolas, SFMono-Regular, monospace; fill: #E2ECE5; }
      .node { font: 600 20px Inter, Segoe UI, sans-serif; fill: #E7EEE9; }
      .status { font: 650 31px Inter, Segoe UI, sans-serif; }
      .green { fill: #82E0AA; }
      .cyan { fill: #55C7E8; }
      .red { fill: #F07878; }
      .muted { fill: #87978E; }
    </style>
  </defs>

  <rect width="1672" height="836" rx="28" fill="#0E1512"/>

  <!-- Incoming paths -->
  <rect x="30" y="254" width="322" height="86" rx="16" fill="#111B17" stroke="#578F7B" stroke-width="2"/>
  <text x="57" y="308" class="route">
    <tspan>GET /tasks/</tspan><tspan class="green">4</tspan>
  </text>

  <rect x="30" y="424" width="322" height="86" rx="16" fill="#111B17" stroke="#578F7B" stroke-width="2"/>
  <text x="57" y="478" class="route">
    <tspan>GET /tasks/</tspan><tspan class="cyan">abc</tspan>
  </text>

  <rect x="30" y="573" width="322" height="72" rx="14" fill="#111B17" stroke="#42685B" stroke-width="2" stroke-dasharray="9 8"/>
  <text x="57" y="619" class="route">GET /tasks/{task_id}</text>

  <!-- FastAPI boundary -->
  <rect x="422" y="114" width="374" height="542" rx="25" fill="#111A16" stroke="#4BC89B" stroke-width="2.5"/>
  <text x="609" y="171" text-anchor="middle" class="group-title">FastAPI</text>
  <text x="609" y="225" text-anchor="middle" class="code">{task_id} → int</text>

  <path d="M360 297H478" stroke="#82E0AA" stroke-width="5.25" marker-end="url(#arrow-green)"/>
  <rect x="493" y="267" width="224" height="82" rx="16" fill="#13251D" stroke="#68D99F" stroke-width="2.5"/>
  <text x="605" y="320" text-anchor="middle" class="status green">4</text>

  <path d="M360 467H478" stroke="#F07878" stroke-width="5.25" marker-end="url(#arrow-red)"/>
  <rect x="493" y="436" width="224" height="82" rx="16" fill="#241718" stroke="#E56672" stroke-width="2.5"/>
  <text x="605" y="489" text-anchor="middle" class="code">
    <tspan class="cyan">abc</tspan><tspan class="muted"> → </tspan><tspan class="red">422</tspan>
  </text>

  <!-- Python lookup and its two outcomes -->
  <rect x="826" y="114" width="535" height="542" rx="25" fill="#111A16" stroke="#4BC89B" stroke-width="2.5"/>
  <text x="1093" y="171" text-anchor="middle" class="group-title">Python Lookup</text>
  <text x="1093" y="225" text-anchor="middle" class="code">task["id"] == task_id</text>

  <path d="M724 308H849" stroke="#82E0AA" stroke-width="5.25" marker-end="url(#arrow-green)"/>
  <circle cx="875" cy="308" r="7" fill="#82E0AA"/>
  <path d="M875 308H906" stroke="#82E0AA" stroke-width="5.25" marker-end="url(#arrow-green)"/>
  <path d="M875 308V464H906" stroke="#55C7E8" stroke-width="5.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/>

  <rect x="916" y="270" width="166" height="76" rx="15" fill="#14231C" stroke="#51B98E" stroke-width="2"/>
  <text x="999" y="318" text-anchor="middle" class="node green">MATCH</text>
  <path d="M1090 308H1116" stroke="#82E0AA" stroke-width="5.25" marker-end="url(#arrow-green)"/>
  <rect x="1126" y="270" width="190" height="76" rx="15" fill="#14231C" stroke="#51B98E" stroke-width="2"/>
  <text x="1221" y="318" text-anchor="middle" class="code">task.copy()</text>

  <rect x="916" y="426" width="166" height="76" rx="15" fill="#132027" stroke="#3C9EB8" stroke-width="2"/>
  <text x="999" y="474" text-anchor="middle" class="node cyan">NO MATCH</text>
  <path d="M1090 464H1116" stroke="#55C7E8" stroke-width="5.25" marker-end="url(#arrow-cyan)"/>
  <rect x="1126" y="426" width="190" height="76" rx="15" fill="#132027" stroke="#3C9EB8" stroke-width="2"/>
  <text x="1221" y="474" text-anchor="middle" class="code cyan">None</text>

  <!-- HTTP results -->
  <rect x="1385" y="114" width="257" height="542" rx="25" fill="#111A16" stroke="#4BC89B" stroke-width="2.5"/>
  <text x="1513" y="171" text-anchor="middle" class="group-title">HTTP Response</text>

  <path d="M1320 308H1403" stroke="#82E0AA" stroke-width="5.25" marker-end="url(#arrow-green)"/>
  <rect x="1414" y="270" width="198" height="76" rx="15" fill="#14231C" stroke="#51B98E" stroke-width="2"/>
  <text x="1513" y="320" text-anchor="middle" class="status green">200</text>

  <path d="M1320 464H1403" stroke="#55C7E8" stroke-width="5.25" marker-end="url(#arrow-cyan)"/>
  <rect x="1414" y="426" width="198" height="76" rx="15" fill="#132027" stroke="#3C9EB8" stroke-width="2"/>
  <text x="1513" y="476" text-anchor="middle" class="status cyan">404</text>

  <rect x="1414" y="548" width="198" height="76" rx="15" fill="#241718" stroke="#E56672" stroke-width="2"/>
  <text x="1513" y="598" text-anchor="middle" class="status red">422</text>

  <!-- Type validation returns before lookup; the red path bypasses Python -->
  <path d="M724 477H778V718H1366V586H1403" stroke="#F07878" stroke-width="5.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
  <text x="1058" y="759" text-anchor="middle" class="node red">VALIDATION BEFORE LOOKUP</text>
</svg>
