<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836" role="img" aria-labelledby="title desc">
  <title id="title">Function composition and caller responsibilities</title>
  <desc id="desc">The caller sends a raw title through normalization and validation before task creation. The full task goes to formatting, and the caller prints the returned string. Invalid values stop before a task is created. Task id and priority come directly from the caller into validation.</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" viewBox="0 0 18 18" refX="0" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L16 9 L0 18 Z" fill="#8FE4AD" />
    </marker>
    <marker id="muted-arrow" markerWidth="18" markerHeight="18" viewBox="0 0 18 18" refX="0" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L16 9 L0 18 Z" fill="#B8B4AA" />
    </marker>
  </defs>
  <rect width="1672" height="836" rx="32" fill="#111412" />

  <rect x="64" y="48" width="300" height="56" rx="18" fill="#191D1A" stroke="#354039" stroke-width="2" />
  <text x="214" y="85" text-anchor="middle" fill="#B8B4AA" font-family="Manrope, Segoe UI, sans-serif" font-size="25" font-weight="700" letter-spacing="1.5">FUNCTION FLOW</text>
  <text x="64" y="153" fill="#F5F2EB" font-family="Manrope, Segoe UI, sans-serif" font-size="38" font-weight="700">One returned value becomes the next input</text>

  <g font-family="Manrope, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="64" y="265" width="410" height="205" rx="24" fill="#191D1A" stroke="#354039" stroke-width="2" />
    <text x="269" y="302" fill="#B8B4AA" font-size="21" font-weight="700" letter-spacing="1">CALLER</text>
    <text x="269" y="357" fill="#F5F2EB" font-family="Consolas, monospace" font-size="30" font-weight="700">input()</text>
    <text x="269" y="402" fill="#F5F2EB" font-family="Consolas, monospace" font-size="24">raw_title</text>
    <text x="269" y="443" fill="#B8B4AA" font-family="Consolas, monospace" font-size="19">task_id + priority</text>

    <rect x="534" y="265" width="410" height="205" rx="24" fill="#191D1A" stroke="#8FE4AD" stroke-width="3" />
    <text x="739" y="302" fill="#8FE4AD" font-size="21" font-weight="700" letter-spacing="1">FUNCTION 01</text>
    <text x="739" y="365" fill="#F5F2EB" font-family="Consolas, monospace" font-size="27" font-weight="700">normalize_title</text>
    <text x="739" y="411" fill="#B8B4AA" font-family="Consolas, monospace" font-size="21">strip() only</text>
    <text x="739" y="447" fill="#B8B4AA" font-family="Consolas, monospace" font-size="19">clean_title</text>

    <rect x="1004" y="265" width="410" height="205" rx="24" fill="#191D1A" stroke="#354039" stroke-width="2" />
    <text x="1209" y="302" fill="#B8B4AA" font-size="21" font-weight="700" letter-spacing="1">CALLER CHECK</text>
    <text x="1209" y="349" fill="#F5F2EB" font-family="Consolas, monospace" font-size="20">clean_title != ""</text>
    <text x="1209" y="390" fill="#F5F2EB" font-family="Consolas, monospace" font-size="20">1 &lt;= priority &lt;= 5</text>
    <text x="1209" y="431" fill="#F5F2EB" font-family="Consolas, monospace" font-size="20">task_id &gt; 0</text>
    <text x="1209" y="458" fill="#B8B4AA" font-size="16" font-weight="600">otherwise: stop</text>

    <rect x="1470" y="338" width="138" height="60" rx="18" fill="#191D1A" stroke="#354039" stroke-width="2" />
    <text x="1539" y="376" fill="#B8B4AA" font-size="18" font-weight="700">NO TASK</text>

    <rect x="1004" y="570" width="410" height="205" rx="24" fill="#191D1A" stroke="#8FE4AD" stroke-width="3" />
    <text x="1209" y="607" fill="#8FE4AD" font-size="21" font-weight="700" letter-spacing="1">FUNCTION 02</text>
    <text x="1209" y="670" fill="#F5F2EB" font-family="Consolas, monospace" font-size="30" font-weight="700">create_task(...)</text>
    <text x="1209" y="716" fill="#B8B4AA" font-family="Consolas, monospace" font-size="22">full task dict</text>
    <text x="1209" y="750" fill="#B8B4AA" font-family="Consolas, monospace" font-size="18">is_done = False</text>

    <rect x="534" y="570" width="410" height="205" rx="24" fill="#191D1A" stroke="#8FE4AD" stroke-width="3" />
    <text x="739" y="607" fill="#8FE4AD" font-size="21" font-weight="700" letter-spacing="1">FUNCTION 03</text>
    <text x="739" y="670" fill="#F5F2EB" font-family="Consolas, monospace" font-size="30" font-weight="700">format_task(task)</text>
    <text x="739" y="716" fill="#B8B4AA" font-family="Consolas, monospace" font-size="22">display string</text>

    <rect x="64" y="570" width="410" height="205" rx="24" fill="#191D1A" stroke="#354039" stroke-width="2" />
    <text x="269" y="607" fill="#B8B4AA" font-size="21" font-weight="700" letter-spacing="1">CALLER</text>
    <text x="269" y="670" fill="#F5F2EB" font-family="Consolas, monospace" font-size="30" font-weight="700">print(message)</text>
    <text x="269" y="716" fill="#B8B4AA" font-family="Consolas, monospace" font-size="22">terminal output</text>
  </g>

  <path d="M269 265 V204 H1209 V249" fill="none" stroke="#8FE4AD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <text x="739" y="184" text-anchor="middle" fill="#B8B4AA" font-family="Consolas, monospace" font-size="20" font-weight="600">task_id + priority</text>

  <path d="M474 368 H518" fill="none" stroke="#8FE4AD" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M944 368 H988" fill="none" stroke="#8FE4AD" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M1209 470 V554" fill="none" stroke="#8FE4AD" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M1004 672 H960" fill="none" stroke="#8FE4AD" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M534 672 H490" fill="none" stroke="#8FE4AD" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="504" y="344" text-anchor="middle" fill="#B8B4AA" font-family="Manrope, Segoe UI, sans-serif" font-size="17" font-weight="700">text</text>
  <text x="974" y="344" text-anchor="middle" fill="#B8B4AA" font-family="Manrope, Segoe UI, sans-serif" font-size="17" font-weight="700">clean</text>
  <text x="1246" y="527" text-anchor="start" fill="#B8B4AA" font-family="Manrope, Segoe UI, sans-serif" font-size="17" font-weight="700">valid</text>
  <text x="974" y="648" text-anchor="middle" fill="#B8B4AA" font-family="Manrope, Segoe UI, sans-serif" font-size="17" font-weight="700">task</text>
  <text x="504" y="648" text-anchor="middle" fill="#B8B4AA" font-family="Manrope, Segoe UI, sans-serif" font-size="17" font-weight="700">string</text>

  <path d="M1414 368 H1454" fill="none" stroke="#B8B4AA" stroke-width="4" stroke-dasharray="9 8" stroke-linecap="round" marker-end="url(#muted-arrow)" />
  <text x="1442" y="340" text-anchor="middle" fill="#B8B4AA" font-family="Manrope, Segoe UI, sans-serif" font-size="16" font-weight="700">invalid</text>

</svg>