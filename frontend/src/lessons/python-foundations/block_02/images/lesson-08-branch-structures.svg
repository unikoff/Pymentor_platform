<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836" role="img" aria-labelledby="title desc">
  <title id="title">Independent checks and one conditional chain</title>
  <desc id="desc">Two independent checks can each run an action. A single priority chain tests thresholds in order and selects only the first matching category.</desc>
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L14 8 L2 14" fill="none" stroke="#8FE4AD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <style>
      .panel { fill: #111412; stroke: #354039; stroke-width: 2; }
      .node { fill: #191D1A; stroke: #354039; stroke-width: 2; }
      .label { fill: #F5F2EB; font: 600 28px Manrope, "Segoe UI", sans-serif; }
      .caption { fill: #B8B4AA; font: 500 20px Manrope, "Segoe UI", sans-serif; }
      .edge { fill: none; stroke: #8FE4AD; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { fill: #B8B4AA; font: 600 18px Manrope, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect width="1672" height="836" fill="#111412" />

  <rect class="panel" x="64" y="64" width="720" height="708" rx="24" />
  <rect class="panel" x="888" y="64" width="720" height="708" rx="24" />
  <text class="label" x="104" y="124">Separate checks</text>
  <text class="caption" x="104" y="158">Each condition controls its own action</text>
  <text class="label" x="928" y="124">One chain</text>
  <text class="caption" x="928" y="158">The first match ends the choice</text>

  <rect class="node" x="112" y="238" width="242" height="104" rx="20" />
  <text class="label" x="233" y="300" text-anchor="middle">has ticket</text>
  <rect class="node" x="472" y="238" width="244" height="104" rx="20" />
  <text class="label" x="594" y="300" text-anchor="middle">ticket notice</text>
  <path class="edge" d="M354 290 H472" />
  <text class="edge-label" x="405" y="272" text-anchor="middle">yes</text>

  <rect class="node" x="112" y="492" width="242" height="104" rx="20" />
  <text class="label" x="233" y="554" text-anchor="middle">seat free</text>
  <rect class="node" x="472" y="492" width="244" height="104" rx="20" />
  <text class="label" x="594" y="554" text-anchor="middle">seat notice</text>
  <path class="edge" d="M354 544 H472" />
  <text class="edge-label" x="405" y="526" text-anchor="middle">yes</text>
  <text class="caption" x="112" y="672">Both actions can run</text>

  <rect class="node" x="928" y="238" width="172" height="104" rx="20" />
  <text class="label" x="1014" y="300" text-anchor="middle">priority</text>
  <rect class="node" x="1160" y="238" width="176" height="104" rx="20" />
  <text class="label" x="1248" y="300" text-anchor="middle">&gt;= 4?</text>
  <rect class="node" x="1160" y="462" width="176" height="104" rx="20" />
  <text class="label" x="1248" y="524" text-anchor="middle">&gt;= 2?</text>
  <rect class="node" x="1400" y="190" width="168" height="96" rx="20" />
  <text class="label" x="1484" y="248" text-anchor="middle">Urgent</text>
  <rect class="node" x="1400" y="462" width="168" height="104" rx="20" />
  <text class="label" x="1484" y="524" text-anchor="middle">In work</text>
  <rect class="node" x="1164" y="650" width="168" height="84" rx="20" />
  <text class="label" x="1248" y="704" text-anchor="middle">Low</text>

  <path class="edge" d="M1100 290 H1160" />
  <path class="edge" d="M1336 290 H1390" />
  <text class="edge-label" x="1362" y="270" text-anchor="middle">yes</text>
  <path class="edge" d="M1248 342 V452" />
  <text class="edge-label" x="1272" y="404">no</text>
  <path class="edge" d="M1336 514 H1390" />
  <text class="edge-label" x="1362" y="494" text-anchor="middle">yes</text>
  <path class="edge" d="M1248 566 V640" />
  <text class="edge-label" x="1272" y="610">no</text>
</svg>
