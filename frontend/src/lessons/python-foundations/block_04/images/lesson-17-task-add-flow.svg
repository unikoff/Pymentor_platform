<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836">
  <title>One task enters the shared list</title>
  <desc>Accepted title and priority and the current task list enter the add operation. It reads existing ids, creates one record, appends it to the same list, and returns that record for formatting and display.</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#8FE4AD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1672" height="836" fill="#111412"/>

  <text x="80" y="104" fill="#F5F2EB" font-family="Manrope, Segoe UI, sans-serif" font-size="38" font-weight="700">One task enters shared state</text>
  <text x="80" y="150" fill="#B8B4AA" font-family="Manrope, Segoe UI, sans-serif" font-size="25">creation, list mutation, and display have separate roles</text>

  <g fill="#191D1A" stroke="#354039" stroke-width="3">
    <rect x="80" y="240" width="300" height="170" rx="24"/>
    <rect x="80" y="510" width="300" height="190" rx="24"/>
    <rect x="510" y="310" width="420" height="320" rx="24"/>
    <rect x="1130" y="220" width="430" height="180" rx="24"/>
    <rect x="1130" y="510" width="430" height="190" rx="24"/>
  </g>

  <g fill="none" stroke="#8FE4AD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M 380 325 V 355 H 510"/>
    <path d="M 380 605 H 445 V 525 H 510"/>
    <path d="M 930 385 H 1020 V 310 H 1130"/>
    <path d="M 930 555 H 1130"/>
  </g>

  <g fill="#B8B4AA" font-family="Manrope, Segoe UI, sans-serif" font-size="21" text-anchor="middle">
    <text x="445" y="306">valid values</text>
    <text x="430" y="490">reads current ids</text>
    <text x="1035" y="292">one append</text>
    <text x="1030" y="536">returns same record</text>
  </g>

  <g fill="#F5F2EB" font-family="Manrope, Segoe UI, sans-serif" text-anchor="middle">
    <text x="230" y="294" font-size="30" font-weight="700">VALID INPUT</text>
    <text x="230" y="345" fill="#B8B4AA" font-family="Consolas, monospace" font-size="25">title + priority</text>
    <text x="230" y="378" fill="#B8B4AA" font-size="20">both values are accepted</text>

    <text x="230" y="563" font-size="30" font-weight="700">CURRENT TASKS</text>
    <text x="230" y="615" fill="#B8B4AA" font-family="Consolas, monospace" font-size="24">tasks</text>
    <text x="230" y="650" fill="#B8B4AA" font-size="20">one list for this run</text>

    <text x="720" y="372" font-size="32" font-weight="700">ADD TASK</text>
    <text x="720" y="433" fill="#B8B4AA" font-family="Consolas, monospace" font-size="23">get_next_id()</text>
    <text x="720" y="478" fill="#B8B4AA" font-family="Consolas, monospace" font-size="23">create_task()</text>
    <text x="720" y="523" fill="#B8B4AA" font-size="23">one list change</text>
    <text x="720" y="578" fill="#8FE4AD" font-size="22">one new record</text>

    <text x="1345" y="278" font-size="30" font-weight="700">SAME TASKS</text>
    <text x="1345" y="330" fill="#B8B4AA" font-size="23">old records + one new</text>
    <text x="1345" y="365" fill="#B8B4AA" font-size="20">the collection is not copied</text>

    <text x="1345" y="566" font-size="29" font-weight="700">RETURNED TASK</text>
    <text x="1345" y="620" fill="#B8B4AA" font-family="Consolas, monospace" font-size="22">format_task()</text>
    <text x="1345" y="658" fill="#B8B4AA" font-size="20">then print the confirmation</text>
  </g>
</svg>
