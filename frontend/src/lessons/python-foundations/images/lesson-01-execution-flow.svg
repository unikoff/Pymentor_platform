<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836" role="img" aria-labelledby="title desc">
  <title id="title">Execution flow</title>
  <desc id="desc">Code goes to the interpreter; output returns to the platform.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#8FE4AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect width="1672" height="836" fill="#111412" />

  <g fill="#191D1A" stroke="#354039" stroke-width="2">
    <rect x="80" y="120" width="570" height="596" rx="24" />
    <rect x="125" y="240" width="280" height="150" rx="18" />
    <rect x="435" y="240" width="170" height="150" rx="18" />
    <rect x="125" y="485" width="480" height="150" rx="18" />
    <rect x="1110" y="210" width="430" height="420" rx="24" />
  </g>

  <g fill="none" stroke="#8FE4AD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M650 315 H1110" />
    <path d="M1110 560 H605" stroke-dasharray="14 12" />
  </g>

  <g font-family="Manrope, Segoe UI, sans-serif" fill="#F5F2EB">
    <text x="155" y="326" font-size="42" font-weight="700">Editor</text>
    <text x="466" y="326" font-size="42" font-weight="700">Run</text>
    <text x="155" y="571" font-size="42" font-weight="700">Output</text>
    <text x="1190" y="430" font-size="42" font-weight="700">Interpreter</text>
  </g>
</svg>
