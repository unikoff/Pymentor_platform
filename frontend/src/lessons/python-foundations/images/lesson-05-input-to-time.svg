<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836" role="img" aria-labelledby="title desc">
  <title id="title">Study time inputs</title>
  <desc id="desc">Two text inputs, one calculation.</desc>
  <defs>
    <marker id="arrow" markerWidth="32" markerHeight="32" viewBox="0 0 32 32" refX="27" refY="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M4 4 L27 16 L4 28" fill="none" stroke="#8FE4AD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect width="1672" height="836" fill="#111412" />

  <g fill="none" stroke="#8FE4AD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M340 246 H374 V366 H408" />
    <path d="M340 590 H374 V470 H408" />
    <path d="M668 418 H710" />
    <path d="M950 418 H970" />
    <path d="M1410 418 H1424 V246 H1440" />
    <path d="M1410 418 H1424 V590 H1440" />
  </g>

  <g fill="#191D1A" stroke="#354039" stroke-width="2">
    <rect x="80" y="156" width="260" height="180" rx="24" />
    <rect x="80" y="500" width="260" height="180" rx="24" />
    <rect x="408" y="318" width="260" height="200" rx="24" />
    <rect x="710" y="318" width="240" height="200" rx="24" />
    <rect x="970" y="298" width="440" height="240" rx="24" />
    <rect x="1440" y="156" width="160" height="180" rx="24" />
    <rect x="1440" y="500" width="160" height="180" rx="24" />
  </g>

  <g font-family="Manrope, Segoe UI, sans-serif" fill="#F5F2EB">
    <text x="112" y="208" font-size="40" font-weight="700">Platform</text>
    <text x="112" y="258" font-family="Consolas, monospace" font-size="26" fill="#B8B4AA">raw_lessons</text>

    <text x="112" y="552" font-size="40" font-weight="700">Keyboard</text>
    <text x="112" y="602" font-family="Consolas, monospace" font-size="26" fill="#B8B4AA">input()</text>

    <text x="440" y="426" font-family="Consolas, monospace" font-size="30" fill="#B8B4AA">str</text>

    <text x="742" y="430" font-family="Consolas, monospace" font-size="30" fill="#B8B4AA">int()</text>

    <text x="1000" y="398" font-size="38" font-weight="700">Formula</text>
    <text x="1000" y="450" font-family="Consolas, monospace" font-size="25" fill="#B8B4AA">lessons × minutes</text>
    <text x="1000" y="490" font-family="Consolas, monospace" font-size="25" fill="#B8B4AA">+ break</text>

    <text x="1460" y="246" font-size="25" font-weight="700">Hours</text>
    <text x="1460" y="284" font-family="Consolas, monospace" font-size="20" fill="#B8B4AA">// 60</text>

    <text x="1460" y="590" font-size="25" font-weight="700">Minutes</text>
    <text x="1460" y="628" font-family="Consolas, monospace" font-size="20" fill="#B8B4AA">% 60</text>
  </g>
</svg>
