<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836" role="img" aria-labelledby="title desc">
  <title id="title">Git flow</title>
  <desc id="desc">File → index → history → GitHub.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 6.5 4 L 1 7" fill="none" stroke="#8FE4AD" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect width="1672" height="836" fill="#111412" />

  <g fill="#191D1A" stroke="#354039" stroke-width="2">
    <rect x="80" y="282" width="260" height="272" rx="22" />
    <rect x="497" y="282" width="260" height="272" rx="22" />
    <rect x="914" y="282" width="260" height="272" rx="22" />
    <rect x="1331" y="282" width="260" height="272" rx="22" />
  </g>

  <g fill="#F5F2EB" font-family="Manrope, 'Segoe UI', sans-serif" font-size="23" font-weight="700" text-anchor="middle">
    <text x="210" y="426">FILE</text>
    <text x="627" y="426">INDEX</text>
    <text x="1044" y="426">HISTORY</text>
    <text x="1461" y="426">GITHUB</text>
  </g>

  <g fill="none" stroke="#8FE4AD" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 370 474 H 467" />
    <path d="M 787 474 H 884" />
    <path d="M 1204 474 H 1301" />
  </g>

  <g fill="#F5F2EB" font-family="Consolas, 'Courier New', monospace" font-size="16" text-anchor="middle">
    <text x="418.5" y="451">ADD</text>
    <text x="835.5" y="451">COMMIT</text>
    <text x="1252.5" y="451">PUSH</text>
  </g>
</svg>
