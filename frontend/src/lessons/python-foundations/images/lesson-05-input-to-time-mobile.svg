<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc">
  <title id="title">Study time inputs</title>
  <desc id="desc">Two text inputs, one calculation.</desc>
  <defs>
    <marker id="arrow" markerWidth="26" markerHeight="26" viewBox="0 0 26 26" refX="22" refY="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M3 3 L22 13 L3 23" fill="none" stroke="#8FE4AD" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect width="720" height="1320" fill="#111412" />

  <g fill="none" stroke="#8FE4AD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M195 230 V280 H360 V340" />
    <path d="M525 230 V280 H360 V340" />
    <path d="M360 490 V540" />
    <path d="M360 700 V750" />
    <path d="M360 1010 V1055 H195 V1090" />
    <path d="M360 1010 V1055 H525 V1090" />
  </g>

  <g fill="#191D1A" stroke="#354039" stroke-width="2">
    <rect x="60" y="80" width="270" height="150" rx="24" />
    <rect x="390" y="80" width="270" height="150" rx="24" />
    <rect x="220" y="340" width="280" height="150" rx="24" />
    <rect x="220" y="540" width="280" height="160" rx="24" />
    <rect x="60" y="750" width="600" height="260" rx="24" />
    <rect x="60" y="1090" width="270" height="160" rx="24" />
    <rect x="390" y="1090" width="270" height="160" rx="24" />
  </g>

  <g font-family="Manrope, Segoe UI, sans-serif" fill="#F5F2EB">
    <text x="92" y="138" font-size="32" font-weight="700">Platform</text>
    <text x="92" y="190" font-family="Consolas, monospace" font-size="25" fill="#B8B4AA">raw_lessons</text>

    <text x="422" y="138" font-size="32" font-weight="700">Keyboard</text>
    <text x="422" y="190" font-family="Consolas, monospace" font-size="25" fill="#B8B4AA">input()</text>

    <text x="252" y="438" font-family="Consolas, monospace" font-size="30" fill="#B8B4AA">str</text>

    <text x="252" y="644" font-family="Consolas, monospace" font-size="30" fill="#B8B4AA">int()</text>

    <text x="96" y="846" font-size="32" font-weight="700">Formula</text>
    <text x="96" y="900" font-family="Consolas, monospace" font-size="26" fill="#B8B4AA">lessons × minutes</text>
    <text x="96" y="946" font-family="Consolas, monospace" font-size="26" fill="#B8B4AA">+ break</text>

    <text x="92" y="1152" font-size="30" font-weight="700">Hours</text>
    <text x="92" y="1202" font-family="Consolas, monospace" font-size="24" fill="#B8B4AA">// 60</text>

    <text x="422" y="1152" font-size="30" font-weight="700">Minutes</text>
    <text x="422" y="1202" font-family="Consolas, monospace" font-size="24" fill="#B8B4AA">% 60</text>
  </g>
</svg>
