<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836" role="img" aria-labelledby="title desc">
  <title id="title">Fetch and pull</title>
  <desc id="desc">Fetch advances origin/main to C; ff-only pull advances main and main.py.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#8FE4AD"/>
    </marker>
    <style>
      .title { font-family: Manrope, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; fill: #F5F2EB; }
      .label { font-family: Manrope, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; fill: #B8B4AA; letter-spacing: 1px; }
      .code { font-family: Consolas, "Courier New", monospace; font-size: 27px; font-weight: 600; fill: #F5F2EB; }
      .body { font-family: Manrope, "Segoe UI", sans-serif; font-size: 23px; fill: #F5F2EB; }
      .muted { font-family: Manrope, "Segoe UI", sans-serif; font-size: 21px; fill: #B8B4AA; }
      .panel { fill: #191D1A; stroke: #354039; stroke-width: 2; }
      .link { fill: none; stroke: #8FE4AD; stroke-width: 5; marker-end: url(#arrow); }
      .reply { fill: none; stroke: #8FE4AD; stroke-width: 5; stroke-dasharray: 12 10; marker-end: url(#arrow); }
      .line { fill: none; stroke: #68746B; stroke-width: 4; }
      .commit { fill: #111412; stroke: #8FE4AD; stroke-width: 4; }
      .commit-muted { fill: #111412; stroke: #B8B4AA; stroke-width: 4; }
      .accent { fill: #8FE4AD; }
    </style>
  </defs>

  <rect width="1672" height="836" rx="0" fill="#111412"/>

  <rect class="panel" x="72" y="280" width="420" height="340" rx="24"/>
  <text class="title" x="112" y="350">GITHUB</text>
  <text class="label" x="112" y="405">main</text>
  <path class="line" d="M 155 500 H 409"/>
  <circle class="commit-muted" cx="165" cy="500" r="15"/>
  <circle class="commit-muted" cx="287" cy="500" r="15"/>
  <circle cx="409" cy="500" r="17" fill="#8FE4AD"/>
  <text class="code" x="154" y="554">A</text>
  <text class="code" x="276" y="554">B</text>
  <text class="code accent" x="398" y="554">C</text>

  <rect class="panel" x="602" y="195" width="470" height="510" rx="24"/>
  <text class="title" x="642" y="265">AFTER FETCH</text>
  <text class="label" x="642" y="337">main</text>
  <path class="line" d="M 792 329 H 954"/>
  <circle class="commit-muted" cx="802" cy="329" r="13"/>
  <circle class="commit-muted" cx="944" cy="329" r="13"/>
  <text class="code" x="794" y="378">A</text>
  <text class="code" x="936" y="378">B</text>

  <text class="label" x="642" y="443">origin/main</text>
  <path class="line" d="M 792 435 H 1014"/>
  <circle class="commit-muted" cx="802" cy="435" r="13"/>
  <circle class="commit-muted" cx="902" cy="435" r="13"/>
  <circle cx="1004" cy="435" r="15" fill="#8FE4AD"/>
  <text class="code" x="794" y="484">A</text>
  <text class="code" x="894" y="484">B</text>
  <text class="code accent" x="994" y="484">C</text>

  <rect x="642" y="568" width="390" height="82" rx="16" fill="#111412" stroke="#354039" stroke-width="2"/>
  <text class="code" x="670" y="621">main.py: B</text>

  <rect class="panel" x="1180" y="280" width="420" height="340" rx="24"/>
  <text class="title" x="1220" y="350">AFTER PULL</text>
  <text class="label" x="1220" y="405">main</text>
  <path class="line" d="M 1300 405 H 1518"/>
  <circle class="commit-muted" cx="1310" cy="405" r="12"/>
  <circle class="commit-muted" cx="1409" cy="405" r="12"/>
  <circle cx="1518" cy="405" r="14" fill="#8FE4AD"/>
  <text class="code" x="1302" y="454">A</text>
  <text class="code" x="1401" y="454">B</text>
  <text class="code accent" x="1510" y="454">C</text>
  <rect x="1220" y="520" width="340" height="66" rx="14" fill="#111412" stroke="#354039" stroke-width="2"/>
  <text class="code" x="1248" y="564">main.py: C</text>

  <path class="link" d="M 602 325 H 492"/>
  <path class="reply" d="M 492 542 H 602"/>
  <text class="label" x="503" y="578">refs</text>

  <path class="link" d="M 1072 450 H 1180"/>
  <text class="label" x="1081" y="420">pull --ff-only</text>
</svg>
