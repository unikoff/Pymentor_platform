      <text x="90" y="522" text-anchor="start">API PROCESS</text>
    </g>
    <g fill="#F5F2EB" font-size="27" font-weight="700">
      <text x="200" y="212">CLI</text>
      <text x="538" y="212">PlannerService</text>
      <text x="910" y="212">JsonStorage</text>
      <text x="200" y="610">HTTP API</text>
      <text x="538" y="610">PlannerService</text>
      <text x="910" y="610">JsonStorage</text>
      <text x="1452" y="405">tasks.json</text>
    </g>
    <g fill="#B8B4AA" font-size="19">
