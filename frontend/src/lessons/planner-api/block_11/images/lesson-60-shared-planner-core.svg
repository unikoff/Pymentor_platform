<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836" role="img" aria-labelledby="title desc">
  <title id="title">Shared Planner Core</title>
  <desc id="desc">CLI and HTTP API use separate PlannerService and JsonStorage instances configured for the same tasks.json file.</desc>
  <defs>
