<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836" fill="none" role="img" aria-labelledby="title description">
  <title id="title">FastAPI validates a request body before calling the endpoint</title>
  <desc id="description">A client sends JSON to FastAPI. Pydantic validates it against TaskCreate. Valid data reaches the temporary echo route and returns 200. Invalid data stops before the route and returns 422.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1672" y2="836" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101916"/>
      <stop offset="1" stop-color="#0B1110"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="28" markerHeight="28" viewBox="0 0 12 12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L10 6L1 11" stroke="#82E0AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" markerWidth="28" markerHeight="28" viewBox="0 0 12 12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L10 6L1 11" stroke="#F07878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, "Segoe UI", sans-serif; fill: #F1F5F2; }
      .subtitle { font: 400 21px Inter, "Segoe UI", sans-serif; fill: #AAB8B0; }
      .label { font: 700 16px Inter, "Segoe UI", sans-serif; letter-spacing: 1.6px; fill: #92A198; }
      .heading { font: 650 26px Inter, "Segoe UI", sans-serif; fill: #ECF2EE; }
      .body { font: 400 19px Inter, "Segoe UI", sans-serif; fill: #BBC8C0; }
      .mono { font: 500 21px Consolas, "SFMono-Regular", monospace; fill: #DCE8E0; }
      .green { fill: #82E0AA; }
      .red { fill: #F07878; }
      .card { fill: #151E1A; stroke: #34443B; stroke-width: 2; }
      .arrow { fill: none; stroke-width: 5.25; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1672" height="836" rx="28" fill="url(#background)"/>
  <text x="58" y="76" class="title">A request is validated before the route runs</text>
  <text x="58" y="116" class="subtitle">FastAPI hands off only data that matches the Pydantic model</text>

  <rect x="48" y="254" width="270" height="208" rx="22" class="card"/>
  <text x="76" y="292" class="label">CLIENT</text>
  <text x="76" y="337" class="heading">POST /tasks</text>
  <rect x="72" y="365" width="222" height="67" rx="13" fill="#101714" stroke="#2D3B33" stroke-width="1.5"/>
  <text x="91" y="393" class="mono" style="font-size:16px">{ title, priority }</text>
  <text x="91" y="418" class="body">JSON body</text>

  <path d="M326 358H367" class="arrow" stroke="#82E0AA" marker-end="url(#arrow-green)"/>

  <rect x="382" y="254" width="270" height="208" rx="22" class="card"/>
  <text x="410" y="292" class="label">FASTAPI</text>
  <text x="410" y="347" class="heading">Read JSON</text>
  <text x="410" y="386" class="body">Parse the request body</text>
  <rect x="408" y="408" width="218" height="34" rx="10" fill="#1A2923"/>
  <text x="426" y="432" class="mono" style="font-size:17px">application/json</text>

  <path d="M660 358H701" class="arrow" stroke="#82E0AA" marker-end="url(#arrow-green)"/>

  <rect x="716" y="226" width="354" height="264" rx="24" fill="#17211D" stroke="#41694E" stroke-width="2"/>
  <text x="746" y="266" class="label">PYDANTIC VALIDATION</text>
  <circle cx="1024" cy="258" r="17" fill="#203C2D" stroke="#527C5C" stroke-width="1.5"/>
  <path d="M1016 258L1022 264L1032 251" stroke="#82E0AA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="746" y="316" class="heading">TaskCreate</text>
  <text x="746" y="365" class="mono">title: str</text>
  <text x="746" y="407" class="mono">priority: int</text>
  <path d="M746 432H1040" stroke="#34473A" stroke-width="1.5"/>
  <text x="746" y="463" class="body" style="font-size:17px">Required fields and types</text>

  <path d="M1078 358H1119" class="arrow" stroke="#82E0AA" marker-end="url(#arrow-green)"/>

  <rect x="1134" y="254" width="244" height="208" rx="22" class="card"/>
  <text x="1162" y="292" class="label">VALID INPUT</text>
  <text x="1162" y="348" class="heading">Route</text>
  <text x="1162" y="389" class="mono" style="font-size:18px">create_task()</text>
  <text x="1162" y="425" class="body">receives the model</text>

  <path d="M1384 358H1425" class="arrow" stroke="#82E0AA" marker-end="url(#arrow-green)"/>

  <rect x="1440" y="276" width="184" height="164" rx="22" fill="#17241C" stroke="#41694E" stroke-width="2"/>
  <text x="1468" y="314" class="label">RESPONSE</text>
  <text x="1468" y="374" class="heading green" style="font-size:38px">200</text>
  <text x="1468" y="410" class="body">OK</text>

  <path d="M893 500V574H1234V663H1278" class="arrow" stroke="#F07878" marker-end="url(#arrow-red)"/>
  <text x="902" y="548" class="label red">MISSING FIELD OR INVALID TYPE</text>

  <rect x="1278" y="594" width="346" height="152" rx="22" fill="#241918" stroke="#78423D" stroke-width="2"/>
  <text x="1310" y="633" class="label red">REJECTED BEFORE THE ROUTE</text>
  <text x="1310" y="693" class="heading red" style="font-size:38px">422</text>
  <text x="1410" y="691" class="body">Validation error</text>

  <text x="58" y="802" class="subtitle">The temporary route echoes validated input. It does not create a task or assign an ID.</text>
</svg>
