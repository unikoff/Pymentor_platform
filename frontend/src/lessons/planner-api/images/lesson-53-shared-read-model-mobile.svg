<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1340" viewBox="0 0 800 1340" fill="none">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="800" y2="1340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101A18"/>
      <stop offset="1" stop-color="#09110F"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#63E7A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
      .title { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 36px; font-weight: 800; fill: #F3F7F5; }
      .subtitle { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 23px; font-weight: 500; fill: #AAB8B2; }
      .lane { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 2px; }
      .card-title { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 30px; font-weight: 750; fill: #F3F7F5; }
      .card-body { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 23px; font-weight: 500; fill: #B7C3BE; }
      .code { font-family: "JetBrains Mono", Consolas, monospace; font-size: 22px; font-weight: 650; fill: #E8F0EC; }
      .muted { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 19px; font-weight: 500; fill: #93A39C; }
      .card { fill: #141F1C; stroke: #2C3D37; stroke-width: 2.5; }
      .file { fill: #19231F; stroke: #55D99A; stroke-width: 3; }
    </style>
  </defs>

  <rect width="800" height="1340" rx="34" fill="url(#background)"/>
  <g transform="translate(0 -100)">
  <text x="76" y="165" class="lane" fill="#72DDF2">HTTP API</text>

  <rect x="76" y="190" width="648" height="110" rx="22" class="card"/>
  <text x="108" y="235" class="card-title">HTTP client</text>
  <text x="108" y="274" class="code" fill="#79E3F6">GET /tasks · GET /stats</text>

  <path d="M400 302V326" stroke="#63E7A8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="76" y="330" width="648" height="110" rx="22" class="card"/>
  <text x="108" y="375" class="card-title">FastAPI</text>
  <text x="108" y="414" class="card-body">GET routes</text>

  <path d="M400 442V476" stroke="#63E7A8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="76" y="480" width="648" height="120" rx="22" class="card"/>
  <text x="108" y="526" class="card-title">app.state.planner</text>
  <text x="108" y="590" class="muted">list_tasks() · get_statistics()</text>

  <path d="M400 602V636" stroke="#63E7A8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="76" y="640" width="648" height="105" rx="22" class="card"/>
  <text x="108" y="684" class="card-title">JsonStorage</text>
  <text x="108" y="722" class="card-body">API · reads JSON</text>

  <text x="76" y="815" class="lane" fill="#63E7A8">CLI</text>
  <rect x="76" y="840" width="648" height="105" rx="22" class="card"/>
  <text x="108" y="884" class="card-title">CLI</text>
  <text x="108" y="922" class="code" fill="#76E9AA">add · done · list · stats</text>

  <path d="M400 947V986" stroke="#63E7A8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="76" y="990" width="648" height="120" rx="22" class="card"/>
  <text x="108" y="1036" class="card-title">build_service() → PlannerService</text>
  <text x="108" y="1075" class="card-body">separate CLI instance</text>

  <path d="M400 1112V1146" stroke="#63E7A8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="76" y="1150" width="648" height="105" rx="22" class="card"/>
  <text x="108" y="1194" class="card-title">JsonStorage</text>
  <text x="108" y="1232" class="card-body">CLI · read/write JSON</text>

  <path d="M400 1257V1296" stroke="#63E7A8" stroke-width="4" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M724 692H754V1360H730" stroke="#72DDF2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="76" y="1300" width="648" height="120" rx="24" class="file"/>
  <text x="108" y="1347" class="lane" fill="#79E8AA">SHARED FILE</text>
  <text x="108" y="1378" class="code">data/tasks.json</text>
  </g>
</svg>
