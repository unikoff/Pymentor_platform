<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Postman and Echo request cycle</title>
  <desc id="description">Postman acts as the HTTP client and sends a request to the Echo service. Echo returns a response to Postman.</desc>
  <defs>
    <marker id="arrow-request" markerWidth="28" markerHeight="28" viewBox="0 0 12 12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L10 6L1 11" stroke="#82E0AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-response" markerWidth="28" markerHeight="28" viewBox="0 0 12 12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L10 6L1 11" stroke="#55C7E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .heading { font: 650 34px Inter, Segoe UI, sans-serif; fill: #F1F5F2; letter-spacing: 1px; }
      .role { font: 650 16px Inter, Segoe UI, sans-serif; fill: #91A198; letter-spacing: 2px; }
      .flow-label { font: 650 18px Inter, Segoe UI, sans-serif; letter-spacing: 1.6px; }
      .green { fill: #82E0AA; }
      .cyan { fill: #55C7E8; }
    </style>
  </defs>

  <rect width="1672" height="836" rx="28" fill="#0E1512"/>

  <!-- Client -->
  <rect x="80" y="170" width="500" height="500" rx="28" fill="#111A16" stroke="#4BC89B" stroke-width="2.5"/>
  <text x="130" y="245" class="heading">POSTMAN</text>
  <text x="132" y="282" class="role">HTTP CLIENT</text>
  <path d="M130 308H530" stroke="#293B32" stroke-width="2"/>

  <rect x="130" y="366" width="400" height="194" rx="20" fill="#142019" stroke="#345143" stroke-width="2"/>
  <circle cx="170" cy="410" r="8" fill="#82E0AA"/>
  <rect x="192" y="402" width="184" height="16" rx="8" fill="#315E49"/>
  <rect x="158" y="448" width="312" height="12" rx="6" fill="#344B3D"/>
  <rect x="158" y="477" width="226" height="12" rx="6" fill="#344B3D"/>
  <rect x="158" y="506" width="270" height="12" rx="6" fill="#344B3D"/>

  <!-- Request travels to Echo -->
  <path d="M580 365H744" stroke="#82E0AA" stroke-width="5.25"/>
  <path d="M928 365H1080" stroke="#82E0AA" stroke-width="5.25" marker-end="url(#arrow-request)"/>
  <rect x="744" y="330" width="184" height="70" rx="17" fill="#14231C" stroke="#51B98E" stroke-width="2.5"/>
  <text x="836" y="374" text-anchor="middle" class="flow-label green">REQUEST</text>

  <!-- Echo service -->
  <rect x="1092" y="170" width="500" height="500" rx="28" fill="#111A16" stroke="#4BC89B" stroke-width="2.5"/>
  <text x="1142" y="245" class="heading">ECHO</text>
  <text x="1144" y="282" class="role">HTTP SERVICE</text>
  <path d="M1142 308H1542" stroke="#293B32" stroke-width="2"/>

  <rect x="1142" y="422" width="400" height="194" rx="20" fill="#132027" stroke="#347184" stroke-width="2"/>
  <circle cx="1182" cy="466" r="8" fill="#55C7E8"/>
  <rect x="1204" y="458" width="184" height="16" rx="8" fill="#285B68"/>
  <rect x="1170" y="504" width="312" height="12" rx="6" fill="#2C5560"/>
  <rect x="1170" y="533" width="226" height="12" rx="6" fill="#2C5560"/>
  <rect x="1170" y="562" width="270" height="12" rx="6" fill="#2C5560"/>

  <!-- Response returns to the client -->
  <path d="M1092 522H928" stroke="#55C7E8" stroke-width="5.25" stroke-dasharray="12 10"/>
  <path d="M744 522H592" stroke="#55C7E8" stroke-width="5.25" stroke-dasharray="12 10" marker-end="url(#arrow-response)"/>
  <rect x="744" y="487" width="184" height="70" rx="17" fill="#132027" stroke="#347184" stroke-width="2.5"/>
  <text x="836" y="531" text-anchor="middle" class="flow-label cyan">RESPONSE</text>
</svg>
