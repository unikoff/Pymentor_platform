<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836" role="img" aria-labelledby="title desc">
  <title id="title">Accumulator state across a loop</title>
  <desc id="desc">The total begins at zero. Adding 2 changes it to 2, adding 5 changes it to 7, and adding 1 changes it to 8.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#8FE4AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <style>
      .label { font-family: Manrope, "Segoe UI", sans-serif; fill: #B8B4AA; font-size: 26px; }
      .value { font-family: Consolas, monospace; fill: #F5F2EB; font-size: 36px; }
      .step { font-family: Consolas, monospace; fill: #8FE4AD; font-size: 28px; }
    </style>
  </defs>
  <rect width="1672" height="836" fill="#111412" />

  <g fill="#191D1A" stroke="#354039" stroke-width="2">
    <rect x="96" y="292" width="300" height="204" rx="24" />
    <rect x="466" y="292" width="300" height="204" rx="24" />
    <rect x="836" y="292" width="300" height="204" rx="24" />
    <rect x="1206" y="292" width="300" height="204" rx="24" />
  </g>

  <g text-anchor="middle">
    <text class="label" x="246" y="358">INITIAL</text>
    <text class="value" x="246" y="430">total = 0</text>

    <text class="label" x="616" y="358">AFTER POINT 2</text>
    <text class="value" x="616" y="430">total = 2</text>

    <text class="label" x="986" y="358">AFTER POINT 5</text>
    <text class="value" x="986" y="430">total = 7</text>

    <text class="label" x="1356" y="358">AFTER POINT 1</text>
    <text class="value" x="1356" y="430">total = 8</text>
  </g>

  <g fill="none" stroke="#8FE4AD" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M404 396 H451" />
    <path d="M774 396 H821" />
    <path d="M1144 396 H1191" />
  </g>
  <g text-anchor="middle">
    <text class="step" x="427" y="258">+ 2</text>
    <text class="step" x="797" y="258">+ 5</text>
    <text class="step" x="1167" y="258">+ 1</text>
  </g>
</svg>
