<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="836" viewBox="0 0 1672 836">
  <title>Numeric input flow</title>
  <desc>A numeric answer is converted and checked. Conversion and rule failures return to the same field; an accepted integer is returned without changing tasks.</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#8FE4AD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1672" height="836" fill="#111412"/>

  <text x="84" y="112" fill="#F5F2EB" font-family="Manrope, Segoe UI, sans-serif" font-size="48" font-weight="700">Numeric input</text>
  <text x="84" y="158" fill="#B8B4AA" font-family="Manrope, Segoe UI, sans-serif" font-size="32">one field, one accepted value</text>

  <g fill="#191D1A" stroke="#354039" stroke-width="3">
    <rect x="84" y="260" width="280" height="180" rx="24"/>
    <rect x="454" y="260" width="310" height="180" rx="24"/>
    <rect x="850" y="260" width="360" height="180" rx="24"/>
    <rect x="1294" y="260" width="294" height="180" rx="24"/>
    <rect x="485" y="520" width="250" height="108" rx="20"/>
    <rect x="886" y="520" width="288" height="108" rx="20"/>
    <rect x="620" y="676" width="430" height="100" rx="22"/>
    <rect x="1282" y="660" width="306" height="116" rx="20"/>
  </g>

  <g fill="none" stroke="#8FE4AD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M 364 350 H 454"/>
    <path d="M 764 350 H 850"/>
    <path d="M 1210 350 H 1294"/>
    <path d="M 609 440 V 520"/>
    <path d="M 1030 440 V 520"/>
    <path d="M 610 628 V 650 H 812 V 676"/>
    <path d="M 1030 628 V 650 H 858 V 676"/>
    <path d="M 620 726 H 224 V 440"/>
  </g>

  <g fill="#B8B4AA" font-family="Manrope, Segoe UI, sans-serif" font-size="30" text-anchor="middle">
    <text x="409" y="322">text</text>
    <text x="807" y="322">integer</text>
    <text x="1252" y="322">accepted</text>
  </g>
  <g fill="#FF7A7A" font-family="Manrope, Segoe UI, sans-serif" font-size="28" text-anchor="middle">
    <text x="660" y="500" text-anchor="start">ValueError</text>
    <text x="1060" y="500" text-anchor="start">rule fails</text>
  </g>
  <text x="200" y="596" text-anchor="end" fill="#B8B4AA" font-family="Manrope, Segoe UI, sans-serif" font-size="28">new input()</text>

  <g fill="#F5F2EB" font-family="Manrope, Segoe UI, sans-serif" text-anchor="middle">
    <text x="224" y="330" font-size="44" font-weight="700">Input</text>
    <text x="224" y="380" fill="#B8B4AA" font-size="32">input() → str</text>

    <text x="609" y="330" font-size="44" font-weight="700">Convert</text>
    <text x="609" y="380" fill="#B8B4AA" font-family="Consolas, monospace" font-size="32">int(raw_value)</text>

    <text x="1030" y="326" font-size="42" font-weight="700">Check rule</text>
    <text x="1030" y="374" fill="#B8B4AA" font-family="Consolas, monospace" font-size="27">priority: 1–5</text>
    <text x="1030" y="412" fill="#B8B4AA" font-family="Consolas, monospace" font-size="27">task_id &gt; 0</text>

    <text x="1441" y="330" font-size="44" font-weight="700">Return</text>
    <text x="1441" y="380" fill="#B8B4AA" font-size="32">accepted int</text>

    <text x="610" y="564" font-size="34" font-weight="700">No integer</text>
    <text x="610" y="600" fill="#B8B4AA" font-size="24">conversion stopped</text>

    <text x="1030" y="564" font-size="34" font-weight="700">Out of range</text>
    <text x="1030" y="600" fill="#B8B4AA" font-size="24">integer exists</text>

    <text x="835" y="718" font-size="38" font-weight="700">Retry same field</text>
    <text x="835" y="754" fill="#B8B4AA" font-size="25">the loop reads a fresh answer</text>

    <text x="1435" y="710" font-size="32" font-weight="700">tasks unchanged</text>
    <text x="1435" y="746" fill="#B8B4AA" font-size="24">no list passed in</text>
  </g>
</svg>
