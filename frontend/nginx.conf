map $http_x_forwarded_proto $pymentor_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

resolver 10.43.0.10 valid=10s ipv6=off;
resolver_timeout 2s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        set $core_api_upstream core-api.pymentor.svc.cluster.local:8001;
        proxy_pass http://$core_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $pymentor_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
