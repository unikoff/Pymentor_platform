apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-preview-notifications
  namespace: pymentor
rules:
- apiGroups: [batch]
  resources: [cronjobs]
  resourceNames: [notifications]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-preview-notifications
  namespace: pymentor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-preview-notifications
subjects:
- kind: ServiceAccount
  name: argocd-application-controller
  namespace: argocd-preview
