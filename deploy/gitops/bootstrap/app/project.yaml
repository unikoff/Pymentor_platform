apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: preview
  namespace: argocd-preview
spec:
  sourceRepos:
  - https://github.com/unikoff/Pymentor_platform.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: pymentor
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: argoproj.io
    kind: Rollout
  - group: argoproj.io
    kind: AnalysisTemplate
  - group: argoproj.io
    kind: AnalysisRun
  - group: ''
    kind: Service
  - group: ''
    kind: ConfigMap
  - group: traefik.io
    kind: IngressRoute
  - group: batch
    kind: Job
  - group: batch
    kind: CronJob
  - group: apps
    kind: Deployment
  - group: networking.k8s.io
    kind: NetworkPolicy
