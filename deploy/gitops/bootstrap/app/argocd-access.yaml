apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-preview-application-controller
  namespace: pymentor
rules:
- apiGroups:
  - argoproj.io
  resources:
  - rollouts
  - analysistemplates
  - analysisruns
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - services
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - traefik.io
  resources:
  - traefikservices
  - ingressroutes
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - events
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - preview-pool-broker
  verbs:
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-preview-application-controller
  namespace: pymentor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-preview-application-controller
subjects:
- kind: ServiceAccount
  name: argocd-application-controller
  namespace: argocd-preview
