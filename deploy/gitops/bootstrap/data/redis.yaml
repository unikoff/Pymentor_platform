apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: knowi-data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: knowi-redis
  template:
    metadata:
      labels:
        app: knowi-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: [sh, -c, 'exec redis-server --bind 0.0.0.0 --protected-mode yes --port 6379 --save "" --appendonly no --requirepass "$REDIS_PASSWORD"']
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-redis-auth
              key: password
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
        readinessProbe:
          exec:
            command: [sh, -c, 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -h 127.0.0.1 ping | grep -q PONG']
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: knowi-data
spec:
  selector:
    app: knowi-redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
