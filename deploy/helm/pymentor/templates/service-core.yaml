apiVersion: v1
kind: Service
metadata:
  # Keep the C1.2 frontend's internal nginx upstream resolvable.
  name: core-api
  labels:
    {{- include "pymentor.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.core.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "pymentor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: core
