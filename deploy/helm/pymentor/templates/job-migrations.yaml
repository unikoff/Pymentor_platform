{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pymentor.fullname" . }}-migrations
  labels:
    {{- include "pymentor.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "pymentor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: migrate
          image: {{ required "Verified immutable migrations.image is required" .Values.migrations.image | quote }}
          command: [python, -m, alembic, -c, /app/services/core-api/alembic-runtime.ini, upgrade, head]
          envFrom:
            - secretRef:
                name: {{ .Values.migrations.secretName }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
{{- end }}
