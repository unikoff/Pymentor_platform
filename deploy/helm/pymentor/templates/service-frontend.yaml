apiVersion: v1
kind: Service
metadata:
  name: {{ include "pymentor.fullname" . }}-frontend
  labels:
    {{- include "pymentor.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "pymentor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
