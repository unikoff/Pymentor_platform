{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pymentor.fullname" . }}-default-deny
  labels:
    {{- include "pymentor.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pymentor.fullname" . }}-dns-egress
  labels:
    {{- include "pymentor.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pymentor.fullname" . }}-frontend
  labels:
    {{- include "pymentor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pymentor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.trustedIngressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "pymentor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: core
      ports:
        - protocol: TCP
          port: {{ .Values.core.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pymentor.fullname" . }}-core
  labels:
    {{- include "pymentor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pymentor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.trustedIngressNamespace }}
        - podSelector:
            matchLabels:
              {{- include "pymentor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: {{ .Values.core.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
